name: Set up the native toolchain
description: >-
  Installs the C++23 compiler, CMake and Ninja a build leg needs. The
  `toolchain` value comes from scripts/ci/plan.py so the workflow never
  hardcodes per-OS steps.

inputs:
  toolchain:
    description: gcc-14 | clang-18 | apple-clang | msvc
    required: true
  msvc_arch:
    description: vcvars architecture for MSVC (amd64 | amd64_arm64)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ninja-build libcurl4-openssl-dev
        case "${{ inputs.toolchain }}" in
          gcc-14)
            sudo apt-get install -y -qq g++-14
            echo "CC=gcc-14" >> "$GITHUB_ENV"
            echo "CXX=g++-14" >> "$GITHUB_ENV"
            ;;
          clang-18)
            sudo apt-get install -y -qq clang-18 libc++-18-dev libc++abi-18-dev
            echo "CC=clang-18" >> "$GITHUB_ENV"
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
            echo "CXXFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
            echo "LDFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"
            ;;
        esac
    - name: macOS packages
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install ninja
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
        clang++ --version
    - name: MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.msvc_arch || 'amd64' }}
    - name: Windows packages
      if: runner.os == 'Windows'
      shell: pwsh
      run: choco install ninja --no-progress -y
    - name: CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~3.31"
