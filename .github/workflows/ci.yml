name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only_os:
        description: "Restrict native legs to one OS (linux|macos|windows); empty for all"
        required: false
        default: ""

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Dynamic workflow: one job computes every matrix below from the target
  # catalogue and the conformance modules on disk (scripts/ci/plan.py), so the
  # fan-out follows the work instead of a hand-maintained list.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      conformance: ${{ steps.plan.outputs.conformance }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          args=""
          if [ -n "${{ github.event.inputs.only_os }}" ]; then args="--only-os ${{ github.event.inputs.only_os }}"; fi
          python3 scripts/ci/plan.py $args
      - name: Version consistency (CMake project == pyproject)
        run: python3 scripts/ci/check_version.py

  # ---------------------------------------------------------------------------
  # The reference implementation's own gate (unchanged contract: it is the
  # oracle the native binary is measured against).
  # ---------------------------------------------------------------------------
  lint:
    name: Reference lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check src tests
      - run: uv run mypy
      - run: uv run pyright
      - run: uv run bandit -c pyproject.toml -r src
      - run: uv run pyscn check src

  python-tests:
    name: Reference tests (${{ matrix.name }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.python) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync
      - run: uv run pytest --ignore=tests/conformance --cov=rohrpost --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.name }}-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: ignore

  complexity:
    name: Reference complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync
      - run: uv run radon cc -a -s src
      - run: uv run radon mi -s src
      - run: uv run xenon --max-absolute B --max-modules A --max-average A src

  # ---------------------------------------------------------------------------
  # Native builds: every leg from the plan builds, runs the C++ unit tests and
  # uploads its `rp` binary as a workflow artifact.
  # ---------------------------------------------------------------------------
  native-build:
    name: Native build (${{ matrix.name }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
        with:
          toolchain: ${{ matrix.toolchain }}
          msvc_arch: ${{ matrix.msvc_arch || '' }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Unit tests
        if: ${{ !matrix.cross }}
        run: ctest --preset ${{ matrix.preset }}
      - name: Smoke
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          bin="build/${{ matrix.preset }}/${{ matrix.exe }}"
          "$bin" --version
          "$bin" --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.preset }}/${{ matrix.exe }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Conformance: the native binary against the Python reference, one shard per
  # (host OS, test module) from the plan.
  # ---------------------------------------------------------------------------
  conformance:
    name: Conformance ${{ matrix.module }} (${{ matrix.os }})
    needs: [plan, native-build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.conformance) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync
      - uses: actions/download-artifact@v4
        with:
          name: rp-${{ matrix.build }}
          path: native
      - name: Make the binary executable
        if: runner.os != 'Windows'
        run: chmod +x native/rp
      - name: Run shard
        shell: bash
        env:
          RP_NATIVE: ${{ runner.os == 'Windows' && format('{0}/native/rp.exe', github.workspace) || format('{0}/native/rp', github.workspace) }}
        run: uv run pytest -q -m conformance tests/conformance/${{ matrix.module }}.py

  # A single required check for branch protection: green when every leg is.
  native-gate:
    name: Native gate
    needs: [native-build, conformance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every native leg succeeded
        run: |
          echo "build: ${{ needs.native-build.result }}"
          echo "conformance: ${{ needs.conformance.result }}"
          test "${{ needs.native-build.result }}" = "success"
          test "${{ needs.conformance.result }}" = "success"

  mutation:
    name: Reference mutation testing
    runs-on: ubuntu-latest
    # Mutation testing is slow and occasionally flaky on a growing codebase:
    # wire it in, but never let it block merge decisions.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync
      - run: uv run mutmut run
