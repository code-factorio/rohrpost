name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check src tests
      - run: uv run mypy
      - run: uv run pyright
      - run: uv run bandit -c pyproject.toml -r src
      - run: uv run pyscn check src

  test:
    name: Tests & coverage (${{ matrix.os }})
    strategy:
      # All three legs report independently: one platform's failure must not
      # cancel the others before their own verdicts are on the record.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync
      - run: uv run pytest --cov=rohrpost --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: ignore

  complexity:
    name: Complexity & maintainability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync
      - run: uv run radon cc -a -s src
      - run: uv run radon mi -s src
      - run: uv run xenon --max-absolute B --max-modules A --max-average A src

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Mutation testing is slow and occasionally flaky on a growing codebase:
    # wire it in, but never let it block merge decisions.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync
      - run: uv run mutmut run
