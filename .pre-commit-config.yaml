default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: "ruff format"
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-check
        name: "ruff check"
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ty
        name: "ty check"
        entry: uv run ty check src tests
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: "mypy"
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: "bandit"
        entry: uv run bandit -c pyproject.toml -r src
        language: system
        types: [python]
        pass_filenames: false

      - id: pyscn
        name: "pyscn"
        entry: uv run pyscn check src
        language: system
        types: [python]
        pass_filenames: false

      # Heavier gate, deferred to pre-push so the local commit loop stays fast.
      - id: pytest
        name: "pytest"
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
