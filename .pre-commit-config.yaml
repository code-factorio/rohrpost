default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: "cargo fmt --check"
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: "cargo clippy"
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # Heavier gate, deferred to pre-push so the local commit loop stays fast.
      - id: cargo-test
        name: "cargo test"
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
